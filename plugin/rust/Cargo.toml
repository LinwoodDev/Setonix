[package]
name = "setonix_plugin"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
anyhow = { version = "1", features = ["backtrace"] }
flutter_rust_bridge = "=2.13.0-beta.6"
futures = "0.3"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }
tokio = "1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
mlua = { version = "0.12", features = ["luau", "send", "async", "anyhow", "serialize", "userdata-wrappers"] }

[features]

[profile.release]
# Native output can otherwise depend on how many CPU cores Cargo uses.
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
