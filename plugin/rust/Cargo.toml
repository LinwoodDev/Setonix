[package]
name = "setonix_plugin"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "setonix_luau"
path = "src/bin/setonix_luau.rs"
required-features = ["web-runtime"]

[dependencies]
anyhow = { version = "1", features = ["backtrace"] }
futures = "0.3"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }
tokio = { version = "1", features = ["sync"] }

mlua = { version = "=0.12.1", features = ["luau", "send", "async", "anyhow", "serialize", "userdata-wrappers"] }

[target.'cfg(not(target_os = "emscripten"))'.dependencies]
flutter_rust_bridge = "=2.14.0-beta.2"

[target.'cfg(target_os = "ios")'.dependencies]
# backtrace 0.3.76 (via flutter_rust_bridge) still uses the iOS dyld
# bindings removed in libc 0.2.190. Keep these until backtrace is updated.
libc = "=0.2.189"

[build-dependencies]
cc = "1"

[features]
web-runtime = []

[profile.release]
# Native output can otherwise depend on how many CPU cores Cargo uses.
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
