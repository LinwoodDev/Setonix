name: Dart quality

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: dart-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        projects: [app, api, plugin, server, tools]
    defaults:
      run:
        working-directory: ${{ matrix.projects }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version-file: app/pubspec.yaml
          cache: true
      - name: Setup Rust
        if: matrix.projects == 'app' || matrix.projects == 'plugin' || matrix.projects == 'server'
        uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Install native build tools
        if: matrix.projects == 'app' || matrix.projects == 'plugin' || matrix.projects == 'server'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev
      - name: Install dependencies
        run: flutter pub get
      - name: Generate core pack
        if: matrix.projects == 'app' || matrix.projects == 'server'
        working-directory: .
        run: |
          dart pub get -C tools
          dart run tools/generate.dart
      - name: Generate localizations
        if: matrix.projects == 'app'
        run: |
          flutter gen-l10n
          dart format lib/src/generated
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze project source
        run: flutter analyze --fatal-infos
      - name: Generate Rust bridge bindings
        if: matrix.projects == 'plugin'
        run: |
          cargo install flutter_rust_bridge_codegen@2.14.0-beta.2 --locked
          flutter_rust_bridge_codegen generate
      - name: Generate models
        if: matrix.projects != 'tools'
        run: dart run build_runner build
      - name: Format generated files
        if: matrix.projects != 'tools'
        run: dart format .
      - name: Verify Rust formatting
        if: matrix.projects == 'plugin'
        run: cargo fmt --manifest-path rust/Cargo.toml --all
      - name: Verify generated files are current
        run: git diff --exit-code
      - name: Run Flutter tests
        if: matrix.projects == 'app'
        run: flutter test
      - name: Run Dart tests
        if: matrix.projects == 'api' || matrix.projects == 'server'
        run: dart test
      - name: Run Rust tests
        if: matrix.projects == 'plugin'
        run: cargo test --manifest-path rust/Cargo.toml --locked
