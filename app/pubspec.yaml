name: setonix
description: Play games without internet

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 0.6.0+10
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: 3.35.6

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  intl: any
  flutter_localized_locales: ^2.0.5
  # UI
  phosphor_flutter: ^2.1.0
  material_leap:
    git:
      url: https://github.com/LinwoodDev/dart_pkgs.git
      ref: 12843672e8f33e9370444b13fca8134f4543f7ee
      path: packages/material_leap
  flex_color_scheme: ^8.1.0
  flutter_svg: ^2.2.0
  window_manager: ^0.5.0
  go_router: ^16.0.0
  # Database
  shared_preferences: ^2.3.1
  # Generation
  barcode: ^2.2.7
  # Internal
  flutter_bloc: ^9.0.0
  rxdart: ^0.28.0
  collection: ^1.18.0
  flame_bloc: ^1.12.14
  flame: ">=1.32.0 <1.33.0"
  flame_tiled: ^3.0.4
  # Networking
  http: ^1.2.1
  web_socket_channel: ^3.0.0
  networker:
    git:
      url: https://github.com/LinwoodDev/dart_pkgs.git
      ref: 4f221c5943ceb786eb7bd427eb71a8cc1346b9b8
      path: packages/networker/networker
  networker_socket:
    git:
      url: https://github.com/LinwoodDev/dart_pkgs.git
      ref: 292186c11472eff9a964893b9b7c6027c000fd81
      path: packages/networker/networker_socket
  swamp_api:
    git:
      url: https://github.com/LinwoodDev/Swamp.git
      ref: 1c15259fc8c5e043997ffcaafbf45348a77e3003
      path: api
  # System Information
  dynamic_color: ^1.7.0
  device_info_plus: ^12.1.0
  package_info_plus: ^9.0.0
  path_provider: ^2.1.4
  url_launcher: ^6.2.6
  file_selector: ^1.0.3
  flutter_secure_storage: ^10.0.0-beta.1
  lw_file_system:
    git:
      url: https://github.com/LinwoodDev/dart_pkgs.git
      ref: 12843672e8f33e9370444b13fca8134f4543f7ee
      path: packages/lw_file_system
  lw_sysapi:
    git:
      url: https://github.com/LinwoodDev/dart_pkgs.git
      ref: 3f886507656f057d89a8b98de6ddbc7f5a21868e
      path: packages/lw_sysapi
  setonix_api:
    path: ../api
  # Serialization
  dart_mappable: ^4.2.2
  archive: ^4.0.2
  markdown_widget: ^2.3.2+8
  markdown: ^7.2.2
  bloc_concurrency: ^0.3.0
  idb_shim: ^2.6.1+7
  # rust_lib_setonix_plugin:
  #   path: rust_builder
  setonix_plugin:
    path: ../plugin
  cryptography_plus: ^2.7.1
  cryptography_flutter_plus: ^2.3.2
  network_info_plus:
    git:
      url: https://github.com/CodeDoctorDE/plus_plugins.git
      ref: 9bd0c023f2dc209576dc66bf989048ba218127b6
      path: packages/network_info_plus/network_info_plus
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  flutter_lints: ^6.0.0
  dart_mappable_builder: ^4.2.3
  integration_test:
    sdk: flutter
  msix: ^3.16.10
# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter.
flutter:
  generate: true
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/fonts/
    - images/
    - assets/pack.stnx
  fonts:
    - family: Comfortaa
      fonts:
        - asset: assets/fonts/Comfortaa-Light.ttf
          weight: 300
        - asset: assets/fonts/Comfortaa-Regular.ttf
          weight: 400
        - asset: assets/fonts/Comfortaa-Medium.ttf
          weight: 500
        - asset: assets/fonts/Comfortaa-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Comfortaa-Bold.ttf
          weight: 700
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Thin.ttf
          weight: 100
        - asset: assets/fonts/Roboto-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/Roboto-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Roboto-Black.ttf
          weight: 900
        - asset: assets/fonts/Roboto-BlackItalic.ttf
          weight: 900
          style: italic
  #  - images/a_dot_burr.jpeg
  #  - images/a_dot_ham.jpeg
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.
  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages
  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: assets/fonts/Schyler-Regular.ttf
  #       - asset: assets/fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: assets/fonts/TrajanPro.ttf
  #       - asset: assets/fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fontsassets//#from-packages
msix_config:
  display_name: Linwood Setonix
  publisher_display_name: Linwood Development
  identity_name: LinwoodDevelopment.linwood-setonix
  logo_path: images/logo.png
  capabilities: documentsLibrary
  languages: en-us
  install_certificate: false
